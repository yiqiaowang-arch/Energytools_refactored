# =====================================================================
# pixi manifest for the energytools multi-install-method scaffold
#
# Dependency strategy ("pypi dependency mapping"):
#   * conda-forge provides the Python interpreter (and, in feature
#     environments, the dev/api/docs tools that are also on conda-forge);
#   * PyPI provides the energytools package itself, mapped as an
#     *editable path dependency* of this repository — `pixi install`
#     therefore behaves like `pip install -e .` inside a conda env.
#
# Environments (see [environments] below):
#   default – python 3.13 + energytools (editable)
#   dev     – default + pytest / pytest-cov / ruff / mypy / build
#   api     – default + fastapi / uvicorn / pydantic-settings
#   docs    – default + mkdocs toolchain (mkdocs + mkdocs-material)
#   full    – dev + api + docs
#
# Tasks: `pixi run <task>` runs in the default environment; tool tasks
# live in the dev feature and run with `pixi run -e dev <task>`.
#
# `pixi.lock` is generated by `pixi install` and is committed to the
# repository for reproducible environments.
# =====================================================================

[workspace]
name = "energytools"
version = "0.1.0"
description = "SIA 2024 energy tools as a Python library (packaging scaffold)"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
# 3.13: reads .pth files as UTF-8 (gh-77102) — required on Windows when the
# checkout path contains non-ASCII characters (e.g. Chinese branch names).
python = "3.13.*"

[pypi-dependencies]
energytools = { path = ".", editable = true }

# ---------------------------------------------------------------------
# Features (optional environments)
# ---------------------------------------------------------------------
[feature.dev.dependencies]
mypy = "*"
pytest = "*"
pytest-cov = "*"
ruff = "*"

# `build` and `hatchling` (pypa) are not packaged on conda-forge for every
# platform; they are PyPI-only tools, so they enter through the pypi
# dependency mapping (mirroring the `dev` extra in pyproject.toml).
[feature.dev.pypi-dependencies]
build = "*"
hatchling = "*"

[feature.api.dependencies]
fastapi = "*"
pydantic-settings = "*"
uvicorn = "*"

[feature.docs.dependencies]
mkdocs = "*"
mkdocs-material = "*"

[environments]
default = []
dev = ["dev"]
api = ["api"]
docs = ["docs"]
full = ["dev", "api", "docs"]

# ---------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------
[tasks]
# Works in the default environment: energytools is installed editable.
version = "python -c 'import energytools; print(energytools.__version__)'"
smoke = "energytools --version"

[feature.dev.tasks]
# `python -m` instead of the bare entry point: the distlib-style `pytest.exe`
# launcher mangles non-ASCII install paths on Windows (cp1252 systems).
test = "python -m pytest"
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy src"
build = "python -m build"
