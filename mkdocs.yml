# =============================================================================
# Energytools documentation site configuration (MkDocs + Material)
# -----------------------------------------------------------------------------
# Local build:
#   pip install -r requirements.txt
#   mkdocs serve     # local preview http://127.0.0.1:8000
#   mkdocs build     # output to site/
# ReadTheDocs build entry point: .readthedocs.yaml
# =============================================================================

site_name: Energytools Documentation
site_description: Energytools — architecture, calculation models, and API reference of the energy tools library
site_url: https://energytools-refactored.readthedocs.io/

# Theme: mkdocs-material (https://squidfunk.github.io/mkdocs-material/)
theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# Repository info (real repository)
repo_name: yiqiaowang-arch/Energytools_refactored
repo_url: https://github.com/yiqiaowang-arch/Energytools_refactored

# Site navigation: Home / Workbook Assessment / Architecture / Calculation Model
# / API Reference / Installation / Release & Deployment
# The three content blocks map to the real documents under
# docs/architecture+api-reference/ and docs/textbook/:
#   * Architecture     -> architecture+api-reference/README + 01 (package & symbol
#     inventory) + 08 (completeness check)
#   * Calculation Model -> textbook/ (chapters 1-6 + appendix A)
#   * API Reference     -> architecture+api-reference/02-07 (per-module API entries)
# All paths are relative to docs_dir (default: docs/).
nav:
  - Home: README.md
  - Workbook Assessment: 01-workbook-assessment.md
  - Architecture:
      - Introduction: architecture+api-reference/README.md
      - Package & Symbol Inventory: architecture+api-reference/01-package-inventory.md
      - Completeness Check: architecture+api-reference/08-completeness-check.md
      - Document-Tree Consistency Report: verification/文档树一致性核对报告.md
  - Calculation Model:
      - Introduction: textbook/README.md
      - Chapter 1 — Moist-Air Physics: textbook/ch01-湿空气物理-Glück多项式与UDF.md
      - Chapter 2 — Room KPI Derivation: textbook/ch02-房间KPI派生.md
      - Chapter 3 — Ventilation Full-Load Hours: textbook/ch03-通风全负荷小时.md
      - Chapter 4 — AHU Temperature-Bin Method: textbook/ch04-AHU温度区间法.md
      - Chapter 5 — Heat Generation & Resultate (Results) Summary: textbook/ch05-产热与Resultate汇总.md
      - Chapter 6 — Climate Data: textbook/ch06-气候数据.md
      - Appendix A — Berechnung LU (LU Calculation) Analysis: textbook/analysis_Berechnung_LU.md
      - Appendix B — Formula & Workbook Cross-Check Report: verification/教科书六章公式与工作簿对拍复核报告.md
  - API Reference:
      - Common Foundation: architecture+api-reference/02-common-foundation.md
      - Raumdaten (Room Data) Service: architecture+api-reference/03-raumdaten-service.md
      - Gebäude (Building) Calculation Engine: architecture+api-reference/04-gebaeude-engine.md
      - Versioning & Export: architecture+api-reference/05-versioning-export.md
      - FastAPI Layer: architecture+api-reference/06-fastapi-layer.md
      - MCP Layer: architecture+api-reference/07-mcp-layer.md
  - Installation: installation.md
  - Release & Deployment:
      - Build & Release Pipeline: deployment/readthedocs.md
      - First-Release Checklist: deployment/release-checklist.md
      - Pre-Release Checklist (User Actions): deployment/发布前置清单与用户操作手册.md

# Markdown extensions
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

# Plugins
plugins:
  - search

# Math rendering (MathJax 3, paired with pymdownx.arithmatex)
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

